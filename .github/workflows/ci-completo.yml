name: 🚀 CI Completo

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # Job 1: Lint e Análise de Código
  lint:
    name: 🔍 Lint e Análise (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [16, 18, 20]
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      
      - name: 📦 Instalar dependências
        working-directory: app
        run: npm ci
      
      - name: 🔍 Executar ESLint
        working-directory: app
        run: npm run lint --if-present
        continue-on-error: true
  
  # Job 2: Testes Unitários
  test:
    name: 🧪 Testes Unitários (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [16, 18, 20]
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      
      - name: 📦 Instalar dependências
        working-directory: app
        run: npm ci
      
      - name: 🧪 Executar testes
        working-directory: app
        run: npm test -- --coverage
      
      - name: 📊 Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-node-${{ matrix.node-version }}
          path: app/coverage/
          retention-days: 7
  
  # Job 3: Build
  build:
    name: 🏗️ Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: [lint, test]  # Espera AMBOS
    strategy:
      fail-fast: false
      matrix:
        node-version: [16, 18, 20]
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      
      - name: 📦 Instalar dependências
        working-directory: app
        run: npm ci
      
      - name: 🏗️ Build aplicação
        working-directory: app
        run: |
          echo "Building application..."
          # Aqui seria npm run build para apps React, etc
          echo "✅ Build completed!"
      
      - name: 📊 Build Summary
        run: |
          echo "## 🏗️ Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Node Version**: ${{ matrix.node-version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ✅ Success" >> $GITHUB_STEP_SUMMARY
